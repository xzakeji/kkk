<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>邮箱验证页面</title>
</head>
<body>
<div style="margin:50px;">
    <input type="email" id="email" placeholder="请输入邮箱" style="padding:8px;width:300px;">
    <button id="sendBtn" style="padding:8px 16px;">发送验证码</button>
    <br><br>
    <input type="text" id="code" placeholder="输入邮箱收到的验证码" style="padding:8px;width:300px;">
    <button id="checkBtn" style="padding:8px 16px;">确认验证</button>
    <p id="tip" style="color:red;"></p>
</div>

<script>
// 改成你自己Worker地址
const API_URL = "https://email-code-api.nameiszcy.workers.dev/";
const tip = document.getElementById("tip");
const sendBtn = document.getElementById("sendBtn");

sendBtn.onclick = async ()=>{
    const email = document.getElementById("email").value.trim();
    if(!email){
        tip.innerText = "请填写邮箱";
        return;
    }
    tip.innerText = "正在发送请求...";
    sendBtn.disabled = true;
    let timer = 60;
    const timerTask = setInterval(()=>{
        sendBtn.innerText = `${timer}秒后重试`;
        timer--;
        if(timer<0){
            clearInterval(timerTask);
            sendBtn.innerText = "发送验证码";
            sendBtn.disabled = false;
        }
    },1000);

    try{
        const res = await fetch(API_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                action:"send",
                email:email
            })
        })
        const data = await res.json();
        tip.innerText = data.msg;
        // 如果后端提示频繁，直接重置按钮
        if(data.msg.includes("等待")){
            clearInterval(timerTask);
            sendBtn.innerText = "发送验证码";
            sendBtn.disabled = false;
        }
    }catch(err){
        tip.innerText = "请求失败，请稍后重试";
        clearInterval(timerTask);
        sendBtn.innerText = "发送验证码";
        sendBtn.disabled = false;
    }
}

document.getElementById("checkBtn").onclick = async ()=>{
    const email = document.getElementById("email").value.trim();
    const code = document.getElementById("code").value.trim();
    tip.innerText = "正在校验...完成后跳转至百度";
    try{
        const res = await fetch(API_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                action:"verify",
                email:email,
                code:code
            })
        })
        const data = await res.json();
        tip.innerText = data.msg;
        if(data.success){
            location.href = "https://www.baidu.com";
        }
    }catch(err){
        tip.innerText = "校验请求异常";
    }
}
</script>
</body>
</html>
